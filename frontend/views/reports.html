<section>
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4">
    <div>
      <h2 class="h4 mb-1">Reports Library</h2>
      <p class="text-muted mb-0">
        Review submitted pickup reports, verify collected items, and export them for compliance.
      </p>
    </div>
    <div class="mt-3 mt-md-0">
      <button class="btn btn-primary me-2" data-role="admin" id="reports-create-btn">New Report</button>
      <button class="btn btn-outline-secondary" data-role="admin" id="reports-export-btn">Export All</button>
    </div>
  </div>

  <div class="card mb-4" data-role="admin">
    <div class="card-body">
      <h3 class="h5 mb-3">Create Report</h3>
      <form id="report-form" class="row g-3">
        <div class="col-12 col-md-4">
          <label for="report-company-id" class="form-label">Company (name or ID)</label>
          <input type="text" class="form-control" id="report-company-id" placeholder="Acme Inc or ID" />
        </div>
        <div class="col-12 col-md-4">
          <label for="report-total-items" class="form-label">Total Items</label>
          <input type="number" class="form-control" id="report-total-items" value="0" readonly />
        </div>
        <div class="col-12 col-md-4">
          <label for="report-status" class="form-label">Status</label>
          <select class="form-select" id="report-status">
            <option value="submitted">Submitted</option>
            <option value="draft">Draft</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="col-12 col-md-2">
          <label for="report-num-pcs" class="form-label">PCs</label>
          <input type="number" class="form-control" id="report-num-pcs" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="report-num-laptops" class="form-label">Laptops</label>
          <input type="number" class="form-control" id="report-num-laptops" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="report-num-surface" class="form-label">Surface</label>
          <input type="number" class="form-control" id="report-num-surface" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="report-num-servers" class="form-label">Servers</label>
          <input type="number" class="form-control" id="report-num-servers" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="report-num-switchers" class="form-label">Switchers</label>
          <input type="number" class="form-control" id="report-num-switchers" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="report-num-hdds" class="form-label">HDDs</label>
          <input type="number" class="form-control" id="report-num-hdds" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="report-memberships" class="form-label">Memberships</label>
          <input type="number" class="form-control" id="report-memberships" value="0" />
        </div>
        <div class="col-12 d-flex justify-content-end">
          <button type="submit" class="btn btn-primary">Save Report</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle" id="reports-table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Company</th>
              <th scope="col">Total Items</th>
              <th scope="col">Points</th>
              <th scope="col">Status</th>
              <th scope="col">Submitted At</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="alert alert-warning mt-3 d-none" id="reports-alert"></div>
      </div>
    </div>
  </div>
</section>
