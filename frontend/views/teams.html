<section>
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4">
    <div>
      <h2 class="h4 mb-1">Team Command Center</h2>
      <p class="text-muted mb-0">
        Track team performance, update rosters, and share pickup visibility across regions.
      </p>
    </div>
    <div class="mt-3 mt-md-0">
      <button class="btn btn-primary me-2" data-role="admin" id="btn-invite-member">Invite Member</button>
      <button class="btn btn-outline-secondary" data-role="admin" id="btn-create-team">Create Team</button>
    </div>
  </div>

  <div class="card mb-4" data-role="admin">
    <div class="card-body">
      <h3 class="h5 mb-3">Create Team</h3>
      <form id="team-form" class="row g-3">
        <div class="col-12 col-md-6">
          <label for="team-name" class="form-label">Team Name</label>
          <input type="text" class="form-control" id="team-name" required />
        </div>
        <div class="col-12 col-md-6">
          <label for="team-region" class="form-label">Region</label>
          <input type="text" class="form-control" id="team-region" required />
        </div>
        <div class="col-12 d-flex justify-content-end">
          <button type="submit" class="btn btn-primary">Save Team</button>
        </div>
      </form>
    </div>
  </div>

  <div class="row" id="team-cards"></div>
</section>
