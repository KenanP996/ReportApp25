<section>
  <div class="row gy-4 align-items-stretch">
    <div class="col-12 col-xl-8">
      <div class="card h-100">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
              <p class="text-uppercase small text-muted mb-1">Personalized</p>
              <h2 class="h4 mb-1" id="dashboard-greeting">Welcome back</h2>
              <p class="text-muted mb-0">Live data pulled from the secured API.</p>
            </div>
            <button class="btn btn-outline-primary btn-sm" id="dashboard-refresh-btn">Refresh Data</button>
          </div>
          <div class="chart-container">
            <canvas id="productivity-chart"></canvas>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-xl-4">
      <div class="card h-100">
        <div class="card-body">
          <h2 class="h4 mb-4">Quick Stats</h2>
          <div class="row g-3">
            <div class="col-12">
              <div class="stat-card p-3 rounded bg-light">
                <p class="text-muted mb-1 small text-uppercase">Reports</p>
                <h3 class="h2 mb-0" id="stat-reports">0</h3>
              </div>
            </div>
            <div class="col-12">
              <div class="stat-card p-3 rounded bg-light">
                <p class="text-muted mb-1 small text-uppercase">Pickups</p>
                <h3 class="h2 mb-0" id="stat-pickups">0</h3>
              </div>
            </div>
            <div class="col-12">
              <div class="stat-card p-3 rounded bg-light">
                <p class="text-muted mb-1 small text-uppercase">Teams</p>
                <h3 class="h2 mb-0" id="stat-teams">0</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row gy-4 mt-1">
    <div class="col-12 col-lg-4">
      <div class="card h-100">
        <div class="card-body">
          <h3 class="h5 mb-3">Upcoming Pickups</h3>
          <ul class="list-group list-group-flush" id="dashboard-pickups"></ul>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-8">
      <div class="card h-100">
        <div class="card-body">
          <h3 class="h5 mb-3">Recent Reports</h3>
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Company</th>
                  <th scope="col">Status</th>
                  <th scope="col">Total Items</th>
                </tr>
              </thead>
              <tbody id="dashboard-reports"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
