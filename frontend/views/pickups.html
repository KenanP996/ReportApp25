<section>
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4">
    <div>
      <h2 class="h4 mb-1">Pickup Coordination</h2>
      <p class="text-muted mb-0">
        Schedule, assign, and track donation pickups across all provinces to keep operations on time.
      </p>
    </div>
    <div class="mt-3 mt-md-0"></div>
  </div>

  <div class="card mb-4" data-role="admin">
    <div class="card-body">
      <h3 class="h5 mb-3">Pickup Request</h3>
      <p class="text-muted small mb-4">
        Search an existing company or provide new details to create the record before scheduling the pickup.
      </p>
      <form id="pickup-form" class="row g-3">
        <div class="col-12">
          <h4 class="h6 text-uppercase text-muted mb-2">Company Details</h4>
        </div>
        <div class="col-12 col-md-4">
          <label for="pickup-company" class="form-label">Company</label>
          <input type="text" class="form-control" id="pickup-company" placeholder="Start typing a company" list="company-options" required />
          <datalist id="company-options"></datalist>
        </div>
        <div class="col-12 col-md-4">
          <label for="pickup-company-name" class="form-label">Company Name (if new)</label>
          <input type="text" class="form-control" id="pickup-company-name" placeholder="Acme Inc." />
        </div>
        <div class="col-12 col-md-4">
          <label for="pickup-company-city" class="form-label">City</label>
          <input type="text" class="form-control" id="pickup-company-city" placeholder="Vancouver" />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-company-province" class="form-label">Province</label>
          <input type="text" class="form-control" id="pickup-company-province" placeholder="BC" maxlength="2" />
        </div>
        <div class="col-12 col-md-3">
          <label for="pickup-company-onboard" class="form-label">Onboarding Date</label>
          <input type="date" class="form-control" id="pickup-company-onboard" />
        </div>
        <div class="col-12 col-md-3">
          <label for="pickup-company-contact-name" class="form-label">Contact Name</label>
          <input type="text" class="form-control" id="pickup-company-contact-name" placeholder="Jordan Smith" />
        </div>
        <div class="col-12 col-md-4">
          <label for="pickup-company-contact-email" class="form-label">Contact Email</label>
          <input type="email" class="form-control" id="pickup-company-contact-email" placeholder="jordan@acme.com" />
        </div>

        <div class="col-12 mt-3">
          <h4 class="h6 text-uppercase text-muted mb-2">Pickup Details</h4>
        </div>
        <div class="col-12 col-md-3">
          <label for="pickup-window-start" class="form-label">Window Start</label>
          <input type="datetime-local" class="form-control" id="pickup-window-start" placeholder="dd/mm/yyyy --:--" required />
        </div>
        <div class="col-12 col-md-3">
          <label for="pickup-window-end" class="form-label">Window End</label>
          <input type="datetime-local" class="form-control" id="pickup-window-end" placeholder="dd/mm/yyyy --:--" required />
        </div>
        <div class="col-12 col-md-3">
          <label for="pickup-location" class="form-label">Location</label>
          <input type="text" class="form-control" id="pickup-location" required />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-num-pcs" class="form-label">PCs</label>
          <input type="number" class="form-control" id="pickup-num-pcs" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-num-laptops" class="form-label">Laptops</label>
          <input type="number" class="form-control" id="pickup-num-laptops" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-num-surface" class="form-label">Surface</label>
          <input type="number" class="form-control" id="pickup-num-surface" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-num-servers" class="form-label">Servers</label>
          <input type="number" class="form-control" id="pickup-num-servers" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-num-switchers" class="form-label">Switchers</label>
          <input type="number" class="form-control" id="pickup-num-switchers" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-num-hdds" class="form-label">HDDs</label>
          <input type="number" class="form-control" id="pickup-num-hdds" value="0" />
        </div>
        <div class="col-12 col-md-2">
          <label for="pickup-memberships" class="form-label">Memberships</label>
          <input type="number" class="form-control" id="pickup-memberships" value="0" />
        </div>
        <div class="col-12 d-flex justify-content-end">
          <button type="submit" class="btn btn-primary">Schedule Pickup</button>
        </div>
      </form>
    </div>
  </div>

  <div id="pickup-list"></div>
</section>
