services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reportapp25
      MYSQL_USER: reportapp_user
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env.docker.example
    environment:
      DB_HOST: db
    volumes:
      - ./scripts:/var/www/html/scripts:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:80:80"

volumes:
  db-data:
